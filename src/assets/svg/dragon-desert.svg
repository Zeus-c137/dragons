<style>
.chest{animation:breath 4.8s ease-in-out infinite}.head{transform-origin:476px 384px;animation:head 4.8s ease-in-out infinite}.tail{transform-origin:254px 423px;animation:tail 4.8s ease-in-out infinite}.storm{animation:storm 4.8s ease-in-out infinite}.frontStorm{animation:frontStorm 4.8s ease-in-out infinite}.grit{animation:grit 1.2s linear infinite}.g2{animation-delay:-.3s}.g3{animation-delay:-.6s}.g4{animation-delay:-.9s}.eye{animation:eye 4.8s ease-in-out infinite}.jaw{transform-origin:551px 410px;animation:jaw 4.8s ease-in-out infinite}
@keyframes breath{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}@keyframes head{0%,100%{transform:rotate(0)}42%,58%{transform:rotate(-2deg)}}@keyframes tail{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(3deg)}}@keyframes storm{0%,100%{transform:translate(-7px,4px);opacity:.35}50%{transform:translate(9px,-6px);opacity:.8}}@keyframes frontStorm{0%,100%{transform:translateX(8px);opacity:.35}50%{transform:translateX(-8px);opacity:.75}}@keyframes grit{0%{opacity:0;transform:translate(-25px,8px)}20%,70%{opacity:.8}100%{opacity:0;transform:translate(45px,-18px)}}@keyframes eye{0%,100%{opacity:.75}45%,60%{opacity:1}}@keyframes jaw{0%,20%,80%,100%{transform:rotate(0)}40%,60%{transform:rotate(4deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.grit{opacity:.45}}
</style></defs>
