<svg xmlns="http://www.w3.org/2000/svg" width="720" height="720" viewBox="0 0 720 720" role="img" aria-label="Песчаный дракон — низкий четвероногий панцирный дрейк, изогнутые рога и песчаная буря">
<defs>
<linearGradient id="hide" x1="0" y1="0" x2=".6" y2="1"><stop stop-color="#d9b776"/><stop offset=".28" stop-color="#ae8247"/><stop offset=".58" stop-color="#75542f"/><stop offset="1" stop-color="#352b27"/></linearGradient>
<linearGradient id="plate" x1="0" y1="0" x2=".4" y2="1"><stop stop-color="#f1d699"/><stop offset=".24" stop-color="#d0a66c"/><stop offset=".55" stop-color="#a67941"/><stop offset="1" stop-color="#4e3e2b"/></linearGradient>
<linearGradient id="horn" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#fff0bd"/><stop offset=".22" stop-color="#d4c094"/><stop offset=".57" stop-color="#91816a"/><stop offset="1" stop-color="#443c34"/></linearGradient>
<linearGradient id="underside" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#b69664"/><stop offset="1" stop-color="#594737"/></linearGradient>
<linearGradient id="sand" x1="0" y1="0" x2="1" y2=".3"><stop stop-color="#c59a52" stop-opacity="0"/><stop offset=".35" stop-color="#f4d38c" stop-opacity=".65"/><stop offset=".7" stop-color="#d4a051" stop-opacity=".5"/><stop offset="1" stop-color="#b77d3c" stop-opacity="0"/></linearGradient>
