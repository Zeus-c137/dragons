<pattern id="scales" width="17" height="16" patternUnits="userSpaceOnUse"><path d="M0 5 8 0 16 5 16 11 8 16 0 11Z" fill="none" stroke="#e6bd7d" stroke-opacity=".22" stroke-width="1"/></pattern>
<filter id="soft" x="-.3" y="-.5" width="1.6" height="2"><feGaussianBlur stdDeviation="6"/></filter>
<filter id="glow" x="-.5" y="-.5" width="2" height="2"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
