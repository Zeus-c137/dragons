<svg xmlns="http://www.w3.org/2000/svg" width="720" height="720" viewBox="0 0 720 720" role="img" aria-label="Изумрудный грозовой дракон — молнии и жемчужина бури">
<defs>
<linearGradient id="jade" x1="0" y1="0" x2="1" y2=".8"><stop stop-color="#71e0ab"/><stop offset=".28" stop-color="#28a383"/><stop offset=".6" stop-color="#147166"/><stop offset="1" stop-color="#09373f"/></linearGradient>
<linearGradient id="gold" x1="0" y1="0" x2=".7" y2="1"><stop stop-color="#fff0b4"/><stop offset=".35" stop-color="#d6b15d"/><stop offset=".7" stop-color="#8c673c"/><stop offset="1" stop-color="#403932"/></linearGradient>
<linearGradient id="mane" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d7ffea"/><stop offset=".35" stop-color="#86ead0"/><stop offset=".7" stop-color="#38a4a3"/><stop offset="1" stop-color="#176076"/></linearGradient>
<radialGradient id="pearl" cx=".35" cy=".3"><stop stop-color="#fff"/><stop offset=".32" stop-color="#dcffed"/><stop offset=".72" stop-color="#68e4da"/><stop offset="1" stop-color="#288398"/></radialGradient>
<radialGradient id="halo"><stop stop-color="#80ffdc" stop-opacity=".4"/><stop offset="1" stop-color="#2ec8d6" stop-opacity="0"/></radialGradient>
<filter id="glow" x="-.7" y="-.7" width="2.4" height="2.4"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="mist" x="-.4" y="-.6" width="1.8" height="2.2"><feGaussianBlur stdDeviation="6"/></filter>
<pattern id="scales" width="23" height="19" patternUnits="userSpaceOnUse"><path d="M-11.5 0 Q0 18 11.5 0 M11.5 0 Q23 18 34.5 0 M0 9.5 Q11.5 27.5 23 9.5" fill="none" stroke="#acf3cb" stroke-opacity=".3" stroke-width="1.3"/></pattern>
<path id="spine" d="M239 563 C159 564 147 496 205 464 C257 434 321 468 385 449 C457 428 496 379 465 329 C438 287 384 313 374 267 L366 239"/>
<style>
.dragon{animation:float 4.8s ease-in-out infinite}.tail{transform-origin:218px 552px;animation:tail 4.8s ease-in-out infinite}.head{transform-origin:369px 254px;animation:head 4.8s ease-in-out infinite}.mane{transform-origin:354px 235px;animation:mane 2.4s ease-in-out infinite}.whisker{transform-origin:434px 239px;animation:whisker 2.4s ease-in-out infinite}.claw{transform-origin:446px 352px;animation:claw 4.8s ease-in-out infinite}.orb{animation:orb 4.8s ease-in-out infinite}.ring{transform-box:fill-box;transform-origin:center;animation:ring 4.8s linear infinite}.bolt{animation:bolt 4.8s steps(1) infinite}.b2{animation-delay:-.15s}.b3{animation-delay:-.35s}.halo{animation:halo 4.8s ease-in-out infinite}.mote{animation:mote 2.4s ease-in-out infinite}.m2{animation-delay:-.8s}.m3{animation-delay:-1.6s}.cloud{animation:cloud 4.8s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(4px)}50%{transform:translateY(-5px)}}@keyframes tail{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(5deg)}}@keyframes head{0%,100%{transform:rotate(-2deg)}45%,60%{transform:rotate(2deg)}}@keyframes mane{0%,100%{transform:skewX(-2deg)}50%{transform:skewX(3deg)}}@keyframes whisker{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(4deg)}}@keyframes claw{0%,100%{transform:rotate(1deg)}40%,60%{transform:rotate(-6deg)}}@keyframes orb{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}@keyframes ring{to{transform:rotate(360deg)}}@keyframes bolt{0%,28%,34%,40%,49%,57%,66%,100%{opacity:0}30%,36%,44%,53%,61%{opacity:1}}@keyframes halo{0%,100%{opacity:.3}38%,58%{opacity:.85}}@keyframes mote{0%,100%{opacity:0;transform:translate(0,8px)}30%{opacity:1}80%{opacity:.3;transform:translate(8px,-28px)}}@keyframes cloud{0%,100%{transform:translateX(-5px);opacity:.3}50%{transform:translateX(5px);opacity:.5}}
</style>
</defs>
<!-- wisps of storm cloud, not a solid background -->
