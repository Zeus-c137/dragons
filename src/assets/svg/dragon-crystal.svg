<svg xmlns="http://www.w3.org/2000/svg" width="720" height="720" viewBox="0 0 720 720" role="img" aria-label="Кристальный дракон — гранёное аметистовое тело, кристаллические крылья и левитирующие осколки">
<defs>
<linearGradient id="amethyst" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#ecd7ff"/><stop offset=".22" stop-color="#b292df"/><stop offset=".48" stop-color="#7657ab"/><stop offset=".75" stop-color="#453d78"/><stop offset="1" stop-color="#202e52"/></linearGradient>
<linearGradient id="facet" x1="0" y1="0" x2=".6" y2="1"><stop stop-color="#fff1ff"/><stop offset=".26" stop-color="#dbb5f5"/><stop offset=".55" stop-color="#a585d5"/><stop offset="1" stop-color="#5c4a94"/></linearGradient>
<linearGradient id="wing" x1="0" y1="0" x2=".9" y2="1"><stop stop-color="#f3d8ff" stop-opacity=".9"/><stop offset=".3" stop-color="#bd8deb" stop-opacity=".8"/><stop offset=".65" stop-color="#7156b4" stop-opacity=".8"/><stop offset="1" stop-color="#333767"/></linearGradient>
<linearGradient id="back" x1="0" y1="0" x2=".5" y2="1"><stop stop-color="#bb9fe8"/><stop offset=".5" stop-color="#6756a0"/><stop offset="1" stop-color="#30385c"/></linearGradient>
<linearGradient id="edge" x1="0" y1="0" x2=".7" y2="1"><stop stop-color="#ffffff"/><stop offset=".3" stop-color="#d4ddff"/><stop offset=".7" stop-color="#b7a3dd"/><stop offset="1" stop-color="#6b77a1"/></linearGradient>
<radialGradient id="halo"><stop stop-color="#b797f4" stop-opacity=".35"/><stop offset="1" stop-color="#977ce0" stop-opacity="0"/></radialGradient>
<filter id="glow" x="-.6" y="-.6" width="2.2" height="2.2"><feGaussianBlur stdDeviation="2.3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<pattern id="scales" width="24" height="20" patternUnits="userSpaceOnUse"><path d="M0 10 12 1 24 10 12 19Z" fill="none" stroke="#dcc6ff" stroke-opacity=".22" stroke-width="1.2"/></pattern>
<path id="torso" d="M311 345 358 324 397 347 414 395 393 438 355 467 311 457 290 419 295 377Z"/>
<path id="neck" d="M365 376 389 329 421 304 431 269 456 252 479 278 464 316 439 351 422 395 397 417Z"/>
<style>
.dragon{animation:levitate 4.8s ease-in-out infinite}.nearWing{transform-origin:325px 357px;animation:nearWing 4.8s ease-in-out infinite}.farWing{transform-origin:388px 348px;animation:farWing 4.8s ease-in-out infinite}.tail{transform-origin:319px 443px;animation:tail 4.8s ease-in-out infinite}.head{transform-origin:450px 284px;animation:head 4.8s ease-in-out infinite}.shard{animation:shard 4.8s ease-in-out infinite}.s2{animation-delay:-1.2s}.s3{animation-delay:-2.4s}.s4{animation-delay:-3.6s}.shine{animation:shine 2.4s ease-in-out infinite}.orbit{animation:orbit 4.8s ease-in-out infinite}.spark{animation:spark 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.k2{animation-delay:-.6s}
@keyframes levitate{0%,100%{transform:translateY(4px)}50%{transform:translateY(-6px)}}@keyframes nearWing{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(3deg)}}@keyframes farWing{0%,100%{transform:rotate(2deg)}50%{transform:rotate(-3deg)}}@keyframes tail{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(5deg)}}@keyframes head{0%,100%{transform:rotate(0)}50%{transform:rotate(-2deg)}}@keyframes shard{0%,100%{transform:translateY(5px) rotate(-4deg)}50%{transform:translateY(-10px) rotate(5deg)}}@keyframes shine{0%,100%{opacity:.35}50%{opacity:.9}}@keyframes orbit{0%,100%{opacity:.3;transform:translateY(3px)}50%{opacity:.65;transform:translateY(-3px)}}@keyframes spark{0%,100%{opacity:.15;transform:scale(.7)}50%{opacity:1;transform:scale(1)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></defs>
