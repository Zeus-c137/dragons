<path id="neck" d="M288 430 C258 399 251 364 249 329 L258 281 222 248 C193 283 193 316 204 350 C205 395 216 429 242 456Z"/>
<style>
.chest{animation:breath 4.8s ease-in-out infinite}.head{transform-origin:236px 297px;animation:nod 4.8s ease-in-out infinite}.tail{transform-origin:432px 464px;animation:sweep 4.8s ease-in-out infinite}.vine{transform-origin:310px 366px;animation:vine 4.8s ease-in-out infinite}.spore{animation:rise 2.4s linear infinite}.s2{animation-delay:-.6s}.s3{animation-delay:-1.2s}.s4{animation-delay:-1.8s}.glimmer{animation:glimmer 4.8s ease-in-out infinite}.beard{transform-origin:191px 290px;animation:beard 2.4s ease-in-out infinite}
@keyframes breath{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}@keyframes nod{0%,100%{transform:rotate(0)}50%{transform:rotate(-2deg)}}@keyframes sweep{0%,100%{transform:rotate(0)}50%{transform:rotate(-4deg)}}@keyframes vine{0%,100%{transform:rotate(-1deg)}50%{transform:rotate(3deg)}}@keyframes rise{0%{opacity:0;transform:translate(0,8px)}20%{opacity:.85}75%{opacity:.6}100%{opacity:0;transform:translate(14px,-57px)}}@keyframes glimmer{0%,100%{opacity:.45}50%{opacity:1}}@keyframes beard{0%,100%{transform:rotate(-1deg)}50%{transform:rotate(3deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.spore{opacity:.5}}
</style></defs>
