<svg xmlns="http://www.w3.org/2000/svg" width="720" height="720" viewBox="0 0 720 720" role="img" aria-label="Лесной дракон — древний рогатый хранитель, мох, лозы и светящиеся споры">
<defs>
<linearGradient id="bark" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#a5ae67"/><stop offset=".24" stop-color="#65734a"/><stop offset=".56" stop-color="#354c38"/><stop offset="1" stop-color="#142d2c"/></linearGradient>
<linearGradient id="root" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#eddfa2"/><stop offset=".3" stop-color="#ac985f"/><stop offset=".7" stop-color="#665a3d"/><stop offset="1" stop-color="#2e382d"/></linearGradient>
<linearGradient id="moss" x1="0" y1="0" x2=".6" y2="1"><stop stop-color="#c3cf6e"/><stop offset=".25" stop-color="#8ca444"/><stop offset=".65" stop-color="#4c702f"/><stop offset="1" stop-color="#284c31"/></linearGradient>
<linearGradient id="belly" x1="0" y1="0" x2="1" y2=".3"><stop stop-color="#b2ae74"/><stop offset=".5" stop-color="#6f794b"/><stop offset="1" stop-color="#344c37"/></linearGradient>
<linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c5d68a"/><stop offset=".35" stop-color="#70964b"/><stop offset="1" stop-color="#244633"/></linearGradient>
<radialGradient id="spore"><stop stop-color="#f2ffc0"/><stop offset=".28" stop-color="#cbe984" stop-opacity=".7"/><stop offset="1" stop-color="#aadd62" stop-opacity="0"/></radialGradient>
<filter id="glow" x="-.6" y="-.6" width="2.2" height="2.2"><feGaussianBlur stdDeviation="2.3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="soft" x="-.3" y="-.5" width="1.6" height="2"><feGaussianBlur stdDeviation="5"/></filter>
<pattern id="scales" width="24" height="21" patternUnits="userSpaceOnUse"><path d="M-12 0 0 12 12 0M12 0 24 12 36 0M0 10 12 22 24 10" stroke="#c4d18b" stroke-opacity=".21" stroke-width="1.25" fill="none"/></pattern>
